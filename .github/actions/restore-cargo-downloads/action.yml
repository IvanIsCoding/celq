name: Restore Cargo downloads
description: Restore the Linux Cargo dependency cache for the current lockfile

runs:
  using: composite
  steps:
    - name: Restore Cargo downloads
      uses: actions/cache/restore@v5.1.0 # zizmor: ignore[unpinned-uses]
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-downloads-linux-targets-v2-${{ hashFiles('Cargo.lock') }}
        fail-on-cache-miss: true
