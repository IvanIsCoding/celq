name: Setup Zigbuild
description: Install the pinned Rust and Zig toolchains for cargo-zigbuild

inputs:
  target:
    description: Rust compilation target
    required: true
  rust_components:
    description: Comma-separated Rust components to install
    required: true
  install_target:
    description: Whether rustup should install the prebuilt Rust target
    required: true
  use_cache:
    description: Whether setup-zig should use its download cache
    required: true

runs:
  using: composite
  steps:
    - name: Install Rust 1.94.1 with target
      if: inputs.install_target == 'true'
      uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      with:
        toolchain: 1.94.1
        targets: ${{ inputs.target }}
        components: ${{ inputs.rust_components }}

    - name: Install Rust 1.94.1 without target
      if: inputs.install_target == 'false'
      uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      with:
        toolchain: 1.94.1
        components: ${{ inputs.rust_components }}

    - name: Install Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.15.2
        use-cache: ${{ inputs.use_cache }}

    - name: Install cargo-zigbuild
      uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
      with:
        tool: cargo-zigbuild@0.23.2

    - name: Install cargo-auditable
      uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
      with:
        tool: cargo-auditable@0.7.5
        fallback: none
