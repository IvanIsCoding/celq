# Release workflow to publish NPM packages
# Courtesy of: https://github.com/orhun/packaging-rust-for-npm/blob/4640d8a33491cc68cddc257b5966c8caa3b4e8c8/.github/workflows/cd.yml#L1
name: Publish to NPM

on:
  workflow_dispatch:  # Manual trigger only
  push:
    tags:
      - "v[0-9]*"      # Trigger on version tags like v1.0.0

permissions:
  contents: read

jobs:
  publish-npm-binaries:
    name: Publish NPM packages
    runs-on: ${{ matrix.build.os }}
    environment: npm_release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: linux-x64-musl,
              OS: ubuntu-24.04,
              TOOLCHAIN: stable,
              TARGET: x86_64-unknown-linux-musl,
            }
          - {
              NAME: linux-arm64-musl,
              OS: ubuntu-24.04-arm,
              TOOLCHAIN: stable,
              TARGET: aarch64-unknown-linux-musl,
            }
          - {
              NAME: linux-riscv64-musl,
              OS: ubuntu-24.04,
              TOOLCHAIN: stable,
              TARGET: riscv64gc-unknown-linux-musl,
              CROSS: true,
            }
          - {
              NAME: win32-x64-msvc,
              OS: windows-2025,
              TOOLCHAIN: stable,
              TARGET: x86_64-pc-windows-msvc,
            }
          - {
              NAME: win32-arm64-msvc,
              OS: windows-2025,
              TOOLCHAIN: stable,
              TARGET: aarch64-pc-windows-msvc,
            }
          - {
              NAME: darwin-x64,
              OS: macos-15,
              TOOLCHAIN: stable,
              TARGET: x86_64-apple-darwin,
            }
          - {
              NAME: darwin-arm64,
              OS: macos-15,
              TOOLCHAIN: stable,
              TARGET: aarch64-apple-darwin,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.build.TARGET }}

      - name: Install cargo-auditable
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Install Zig (for cross-compilation)
        if: matrix.build.CROSS == true
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          use-cache: false

      - name: Install cargo-zigbuild (for cross-compilation)
        if: matrix.build.CROSS == true
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-zigbuild@0.23.2

      - name: Install musl tools (for musl targets)
        if: contains(matrix.build.TARGET, 'musl') && matrix.build.CROSS != true
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        if: matrix.build.CROSS != true
        run: cargo auditable build --release --locked --target ${{ matrix.build.TARGET }}

      - name: Build with Zig
        if: matrix.build.CROSS == true
        run: cargo auditable zigbuild --release --locked --target ${{ matrix.build.TARGET }}

      - name: Install node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Make publish script executable
        shell: bash
        run: chmod +xw ./.github/scripts/publish-npm-binary.sh

      - name: Publish to NPM
        shell: bash
        run: |
          ./.github/scripts/publish-npm-binary.sh \
            "${{ matrix.build.NAME }}" \
            "${{ matrix.build.OS }}" \
            "${{ matrix.build.TARGET }}"

  publish-npm-base:
    name: Publish the base NPM package
    needs: publish-npm-binaries
    environment: npm_release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish the package
        shell: bash
        run: |
          RELEASE_VERSION=$(npx -y celq@0.6.0 --from-toml --raw-output  "this.package.version" < "Cargo.toml")
          cp README.md npm/celq/README.md
          cp LICENSE-APACHE npm/celq/LICENSE-APACHE
          cp LICENSE-MIT npm/celq/LICENSE-MIT
          npx -y celq@0.6.0 \
              -n \
              -p \
              -S \
              --from-file "npm/celq/package.json.cel" \
              --arg="node_version:string=${RELEASE_VERSION}" \
              > "npm/celq/package.json"
          cd npm/celq
          yarn install --no-immutable # requires optional dependencies to be present in the registry
          yarn build
          npm publish --access public
