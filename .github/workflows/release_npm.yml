# Release workflow to publish NPM packages
# Courtesy of: https://github.com/orhun/packaging-rust-for-npm/blob/4640d8a33491cc68cddc257b5966c8caa3b4e8c8/.github/workflows/cd.yml#L1
name: Publish to NPM

on:
  workflow_dispatch:  # Manual trigger only
  push:
    tags:
      - "v[0-9]*"      # Trigger on version tags like v1.0.0

permissions:
  contents: read

jobs:
  publish-npm-binaries:
    name: Publish NPM packages
    runs-on: ubuntu-24.04
    environment: npm_release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: linux-x64-musl,
              OS: ubuntu-24.04,
              ARCHIVE: celq-linux-x86_64-musl.tar.gz,
            }
          - {
              NAME: linux-arm64-musl,
              OS: ubuntu-24.04-arm,
              ARCHIVE: celq-linux-aarch64-musl.tar.gz,
            }
          - {
              NAME: linux-riscv64-musl,
              OS: ubuntu-24.04,
              ARCHIVE: celq-linux-riscv64-musl.tar.gz,
            }
          - {
              NAME: win32-x64-msvc,
              OS: windows-2025,
              ARCHIVE: celq-windows-x86_64.zip,
            }
          - {
              NAME: win32-arm64-msvc,
              OS: windows-2025,
              ARCHIVE: celq-windows-arm64.zip,
            }
          - {
              NAME: darwin-x64,
              OS: macos-15,
              ARCHIVE: celq-macos-x86_64.tar.gz,
            }
          - {
              NAME: darwin-arm64,
              OS: macos-15,
              ARCHIVE: celq-macos-aarch64.tar.gz,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release binary and checksums
        env:
          ARCHIVE: ${{ matrix.build.ARCHIVE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION=$(npx -y celq@0.6.0 --from-toml --raw-output "this.package.version" < Cargo.toml)
          TAG="v${RELEASE_VERSION}"
          mkdir -p release-assets release-binary
          gh release download "${TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "${ARCHIVE}" \
            --pattern SHA256SUMS \
            --dir release-assets

      - name: Verify and extract release binary
        env:
          ARCHIVE: ${{ matrix.build.ARCHIVE }}
        run: |
          cd release-assets
          grep -F "  ${ARCHIVE}" SHA256SUMS | sha256sum --check
          case "${ARCHIVE}" in
            *.tar.gz) tar xzf "${ARCHIVE}" -C ../release-binary ;;
            *.zip) unzip -q "${ARCHIVE}" -d ../release-binary ;;
          esac

      - name: Make publish script executable
        shell: bash
        run: chmod +xw ./.github/scripts/publish-npm-binary.sh

      - name: Publish to NPM
        shell: bash
        run: |
          ./.github/scripts/publish-npm-binary.sh \
            "${{ matrix.build.NAME }}" \
            "${{ matrix.build.OS }}" \
            "release-binary/celq${{ startsWith(matrix.build.OS, 'windows-') && '.exe' || '' }}"

  publish-npm-base:
    name: Publish the base NPM package
    needs: publish-npm-binaries
    environment: npm_release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish the package
        shell: bash
        run: |
          RELEASE_VERSION=$(npx -y celq@0.6.0 --from-toml --raw-output  "this.package.version" < "Cargo.toml")
          cp README.md npm/celq/README.md
          cp LICENSE-APACHE npm/celq/LICENSE-APACHE
          cp LICENSE-MIT npm/celq/LICENSE-MIT
          npx -y celq@0.6.0 \
              -n \
              -p \
              -S \
              --from-file "npm/celq/package.json.cel" \
              --arg="node_version:string=${RELEASE_VERSION}" \
              > "npm/celq/package.json"
          cd npm/celq
          yarn install --no-immutable # requires optional dependencies to be present in the registry
          yarn build
          npm publish --access public
