name: GitHub Release v0.7.0 Remaining Jobs

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  NAME: celq
  VERSION: v0.7.0

permissions:
  contents: read

jobs:
  update-install-script:
    name: Update install script on GitHub Pages
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: $/.github/workflows/release_sub_pages.yml
    with:
      version: v0.7.0
    secrets:
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}

  update-homebrew-formula:
    name: Update Homebrew formula
    permissions:
      contents: read
    uses: $/.github/workflows/release_sub_homebrew.yml
    with:
      version: v0.7.0
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  update-scoop-manifest:
    name: Update Scoop manifest
    permissions:
      contents: read
    uses: $/.github/workflows/release_sub_scoop.yml
    with:
      version: v0.7.0
    secrets:
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  generate-checksums:
    name: Generate SHA256 checksums
    needs: [update-install-script]
    runs-on: ubuntu-latest
    environment: github_release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/release-assets
          cd /tmp/release-assets
          gh release download "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "celq-*.tar.gz" \
            --pattern "celq-*.tar.zst" \
            --pattern "celq-*.zip" \
            --pattern "install.sh"
          ls -lh

      - name: Generate checksums file
        run: |
          cd /tmp/release-assets
          sha256sum celq-* install.sh | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Generate attestation for checksums file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: /tmp/release-assets/SHA256SUMS

      - name: Upload checksums file to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${VERSION}" /tmp/release-assets/SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --clobber

  create-minisign-release:
    name: Create Minisign release
    needs: [generate-checksums]
    runs-on: ubuntu-latest
    environment: github_release
    permissions:
      contents: read
    steps:
      - name: Create signatures release if needed
        env:
          GH_TOKEN: ${{ secrets.SIGNATURES_TOKEN }}
          SIGNATURES_REPOSITORY: get-celq/signatures
        run: |
          if gh release view "${VERSION}" --repo "${SIGNATURES_REPOSITORY}" >/dev/null 2>&1; then
            echo "Signatures release ${VERSION} already exists"
          else
            gh release create "${VERSION}" \
              --repo "${SIGNATURES_REPOSITORY}" \
              --title "celq ${VERSION} signatures" \
              --notes "Detached Minisign signatures for celq ${VERSION} release archives."
          fi

  minisign-release-assets:
    name: Minisign (${{ matrix.target }})
    needs: [create-minisign-release]
    runs-on: ubuntu-latest
    environment: github_release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, archive: celq-macos-aarch64.tar.gz, archive_suffix: tar.gz }
          - { target: aarch64-apple-darwin, archive: celq-macos-aarch64.tar.zst, archive_suffix: tar.zst }
          - { target: x86_64-apple-darwin, archive: celq-macos-x86_64.tar.gz, archive_suffix: tar.gz }
          - { target: x86_64-pc-windows-msvc, archive: celq-windows-x86_64.zip, archive_suffix: zip }
          - { target: aarch64-pc-windows-msvc, archive: celq-windows-arm64.zip, archive_suffix: zip }
          - { target: x86_64-unknown-linux-musl, archive: celq-linux-x86_64-musl.tar.gz, archive_suffix: tar.gz }
          - { target: x86_64-unknown-linux-musl, archive: celq-linux-x86_64-musl.tar.zst, archive_suffix: tar.zst }
          - { target: aarch64-unknown-linux-musl, archive: celq-linux-aarch64-musl.tar.gz, archive_suffix: tar.gz }
          - { target: aarch64-unknown-linux-musl, archive: celq-linux-aarch64-musl.tar.zst, archive_suffix: tar.zst }
          - { target: x86_64-unknown-linux-gnu, archive: celq-linux-x86_64-gnu.tar.gz, archive_suffix: tar.gz }
          - { target: x86_64-unknown-linux-gnu, archive: celq-linux-x86_64-gnu.tar.zst, archive_suffix: tar.zst }
          - { target: aarch64-unknown-linux-gnu, archive: celq-linux-aarch64-gnu.tar.gz, archive_suffix: tar.gz }
          - { target: aarch64-unknown-linux-gnu, archive: celq-linux-aarch64-gnu.tar.zst, archive_suffix: tar.zst }
          - { target: riscv64gc-unknown-linux-musl, archive: celq-linux-riscv64-musl.tar.gz, archive_suffix: tar.gz }
          - { target: riscv64gc-unknown-linux-gnu, archive: celq-linux-riscv64-gnu.tar.gz, archive_suffix: tar.gz }
          - { target: powerpc64le-unknown-linux-musl, archive: celq-linux-ppc64le-musl.tar.gz, archive_suffix: tar.gz }
          - { target: powerpc64le-unknown-linux-gnu, archive: celq-linux-ppc64le-gnu.tar.gz, archive_suffix: tar.gz }
          - { target: x86_64-unknown-freebsd, archive: celq-freebsd-x86_64.tar.gz, archive_suffix: tar.gz }
          - { target: aarch64-unknown-freebsd, archive: celq-freebsd-aarch64.tar.gz, archive_suffix: tar.gz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: v0.7.0

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes minisign

      - name: Download release archive
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release-assets"
          gh release download "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ARCHIVE_NAME}" \
            --dir "${RUNNER_TEMP}/release-assets"

      - name: Sign release archive
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/release-assets/${ARCHIVE_NAME}"
          SIGNATURE_PATH="${RUNNER_TEMP}/release-assets/${NAME}-${TARGET}.${ARCHIVE_SUFFIX}.sig"
          .github/scripts/sign-release-archive.sh "${ARCHIVE_PATH}" "${SIGNATURE_PATH}"

      - name: Upload signature
        env:
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
          GH_TOKEN: ${{ secrets.SIGNATURES_TOKEN }}
          SIGNATURES_REPOSITORY: get-celq/signatures
          TARGET: ${{ matrix.target }}
        run: |
          SIGNATURE_PATH="${RUNNER_TEMP}/release-assets/${NAME}-${TARGET}.${ARCHIVE_SUFFIX}.sig"
          gh release upload "${VERSION}" "${SIGNATURE_PATH}" \
            --repo "${SIGNATURES_REPOSITORY}" \
            --clobber

  generate-sboms:
    name: SBOM (${{ matrix.target }})
    needs: [generate-checksums]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, archive: celq-macos-aarch64.tar.gz, binary: celq }
          - { target: macos-x86_64, archive: celq-macos-x86_64.tar.gz, binary: celq }
          - { target: windows-x86_64, archive: celq-windows-x86_64.zip, binary: celq.exe }
          - { target: windows-arm64, archive: celq-windows-arm64.zip, binary: celq.exe }
          - { target: linux-x86_64-musl, archive: celq-linux-x86_64-musl.tar.gz, binary: celq }
          - { target: linux-aarch64-musl, archive: celq-linux-aarch64-musl.tar.gz, binary: celq }
          - { target: linux-x86_64-gnu, archive: celq-linux-x86_64-gnu.tar.gz, binary: celq }
          - { target: linux-aarch64-gnu, archive: celq-linux-aarch64-gnu.tar.gz, binary: celq }
          - { target: linux-riscv64-gnu, archive: celq-linux-riscv64-gnu.tar.gz, binary: celq }
          - { target: linux-riscv64-musl, archive: celq-linux-riscv64-musl.tar.gz, binary: celq }
          - { target: linux-ppc64le-gnu, archive: celq-linux-ppc64le-gnu.tar.gz, binary: celq }
          - { target: linux-ppc64le-musl, archive: celq-linux-ppc64le-musl.tar.gz, binary: celq }
          - { target: freebsd-x86_64, archive: celq-freebsd-x86_64.tar.gz, binary: celq }
          - { target: freebsd-aarch64, archive: celq-freebsd-aarch64.tar.gz, binary: celq }
    uses: $/.github/workflows/release_sub_calculate_sboms.yml
    with:
      target: ${{ matrix.target }}
      archive: ${{ matrix.archive }}
      binary: ${{ matrix.binary }}
      version: v0.7.0

  attest-sboms:
    name: Attest SBOM (${{ matrix.target }})
    needs: [generate-sboms]
    runs-on: ubuntu-latest
    environment: github_release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, binary: celq }
          - { target: macos-x86_64, binary: celq }
          - { target: windows-x86_64, binary: celq.exe }
          - { target: windows-arm64, binary: celq.exe }
          - { target: linux-x86_64-musl, binary: celq }
          - { target: linux-aarch64-musl, binary: celq }
          - { target: linux-x86_64-gnu, binary: celq }
          - { target: linux-aarch64-gnu, binary: celq }
          - { target: linux-riscv64-gnu, binary: celq }
          - { target: linux-riscv64-musl, binary: celq }
          - { target: linux-ppc64le-gnu, binary: celq }
          - { target: linux-ppc64le-musl, binary: celq }
          - { target: freebsd-x86_64, binary: celq }
          - { target: freebsd-aarch64, binary: celq }
    steps:
      - name: Download SBOM attestation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-attestation-${{ matrix.target }}

      - name: Attest binary SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: binary/${{ matrix.binary }}
          sbom-path: ${{ needs.generate-sboms.outputs.spdx_json_path }}

      - name: Attest binary CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: binary/${{ matrix.binary }}
          sbom-path: ${{ needs.generate-sboms.outputs.cyclonedx_json_path }}
