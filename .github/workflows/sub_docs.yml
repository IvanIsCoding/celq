name: Documentation (Subworkflow)

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cargo downloads
        uses: $/.github/actions/restore-cargo-downloads

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build documentation
        run: cargo rustdoc --lib --all-features -- -D warnings --extend-css docs/rustdoc.css --html-in-header docs/rustdoc-header.html

      - name: Upload documentation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: documentation
          path: target/doc/
          retention-days: 1
