name: Release to PyPI

on:
  workflow_dispatch:  # Manual trigger only
  push:
    tags:
      - "v[0-9]*"      # Trigger on version tags like v1.0.0

permissions:
  contents: read

jobs:
  publish-binaries:
    name: Publish binaries
    runs-on: ${{ matrix.build.os }}
    environment: pypi_release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: linux-x64,
              OS: ubuntu-24.04,
              TOOLCHAIN: 1.94.1,
              TARGET: x86_64-unknown-linux-gnu,
              MANYLINUX: manylinux_2_28,
              ZIG: 0.15.1,
            }
          - {
              NAME: linux-x64,
              OS: ubuntu-24.04,
              TOOLCHAIN: 1.94.1,
              TARGET: x86_64-unknown-linux-musl,
              ZIG: 0.15.1,
            }
          # Linux wheels use explicit Zig versions per architecture.
          - {
              NAME: linux-arm64,
              OS: ubuntu-24.04-arm,
              TOOLCHAIN: 1.94.1,
              TARGET: aarch64-unknown-linux-gnu,
              MANYLINUX: manylinux_2_28,
              ZIG: 0.14.1,
            }
          - {
              NAME: linux-riscv64,
              OS: ubuntu-24.04,
              TOOLCHAIN: 1.94.1,
              TARGET: riscv64gc-unknown-linux-gnu,
              MANYLINUX: manylinux_2_31,
              ZIG: 0.15.1,
            }
          - {
              NAME: linux-riscv64,
              OS: ubuntu-24.04,
              TOOLCHAIN: 1.94.1,
              TARGET: riscv64gc-unknown-linux-musl,
              ZIG: 0.15.1,
            }
          - {
              NAME: win32-x64-msvc,
              OS: windows-2025,
              TOOLCHAIN: 1.94.1,
              TARGET: x86_64-pc-windows-msvc,
            }
          - {
              NAME: win32-arm64-msvc,
              OS: windows-11-vs2026-arm,
              TOOLCHAIN: 1.94.1,
              TARGET: aarch64-pc-windows-msvc,
            }
          - {
              NAME: darwin-arm64,
              OS: macos-15,
              TOOLCHAIN: 1.94.1,
              TARGET: aarch64-apple-darwin,
            }
          - {
              NAME: darwin-x64,
              OS: macos-15,
              TOOLCHAIN: 1.94.1,
              TARGET: x86_64-apple-darwin,
            }
          - {
              NAME: linux-arm64,
              OS: ubuntu-24.04-arm,
              TOOLCHAIN: 1.94.1,
              TARGET: aarch64-unknown-linux-musl,
              ZIG: 0.14.1,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.build.TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.build.TOOLCHAIN }}
          targets: ${{ matrix.build.TARGET }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.22"
          enable-cache: false

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install cargo-auditable
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-zigbuild@0.23.2
          fallback: none

      - name: Configure Maturin to use cargo-auditable
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CARGO=$GITHUB_WORKSPACE/.github/scripts/cargo-auditable-wrapper.sh" >> "$GITHUB_ENV"

      - name: Configure Maturin to use cargo-auditable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoWrapper = Join-Path $env:GITHUB_WORKSPACE ".github\scripts\cargo-auditable-wrapper.bat"
          "CARGO=$cargoWrapper" >> $env:GITHUB_ENV

      - name: Build Python wheels (Linux manylinux with Zig)
        if: runner.os == 'Linux' && contains(matrix.build.TARGET, '-gnu')
        working-directory: pypi
        run: |
          uvx --from maturin==1.12.3 --with ziglang==${{ matrix.build.ZIG }} \
            maturin build --release --target ${{ matrix.build.TARGET }} --zig \
            --compatibility ${{ matrix.build.MANYLINUX }} --out dist

      - name: Build Python wheels (Linux musllinux with Zig)
        if: runner.os == 'Linux' && contains(matrix.build.TARGET, '-musl')
        working-directory: pypi
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          uvx --from maturin==1.12.3 --with ziglang==${{ matrix.build.ZIG }} \
            maturin build --release --target ${{ matrix.build.TARGET }} --zig --out dist

      - name: Build Python wheels (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: pypi
        shell: bash
        run: |
          uvx --from maturin==1.12.3 maturin build --release \
            --target ${{ matrix.build.TARGET }} --out dist

      - name: Publish wheels to PyPI
        run: uv publish --trusted-publishing always pypi/dist/*.whl

  publish-source:
    name: Publish source distribution
    runs-on: ubuntu-24.04
    environment: pypi_release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.22"
          enable-cache: false

      - name: Build source distribution
        working-directory: pypi
        run: uv build --sdist --out-dir dist

      - name: Publish source distribution to PyPI
        run: uv publish --trusted-publishing always pypi/dist/*.tar.gz
