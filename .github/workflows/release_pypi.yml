name: Release to PyPI

on:
  workflow_dispatch:  # Manual trigger only
  push:
    tags:
      - "v[0-9]*"      # Trigger on version tags like v1.0.0

permissions:
  contents: read

jobs:
  publish-binaries:
    name: Publish binaries
    runs-on: ${{ matrix.build.os }}
    environment: pypi_release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        build:
          # setup-maturin installs Zig 0.15.2, while uvx supplies the wheel-specific
          # Zig versions below until their architecture constraints are unified.
          - {
              NAME: linux-x64,
              OS: ubuntu-24.04,
              TARGET: x86_64-unknown-linux-gnu,
              MANYLINUX: manylinux_2_28,
              ZIG: 0.15.1,
            }
          - {
              NAME: linux-x64,
              OS: ubuntu-24.04,
              TARGET: x86_64-unknown-linux-musl,
              ZIG: 0.15.1,
            }
          # Linux wheels use explicit Zig versions per architecture.
          - {
              NAME: linux-arm64,
              OS: ubuntu-24.04-arm,
              TARGET: aarch64-unknown-linux-gnu,
              MANYLINUX: manylinux_2_28,
              ZIG: 0.14.1,
            }
          - {
              NAME: linux-riscv64,
              OS: ubuntu-24.04,
              TARGET: riscv64gc-unknown-linux-gnu,
              MANYLINUX: manylinux_2_31,
              ZIG: 0.15.1,
            }
          - {
              NAME: linux-riscv64,
              OS: ubuntu-24.04,
              TARGET: riscv64gc-unknown-linux-musl,
              ZIG: 0.15.1,
            }
          - {
              NAME: win32-x64-msvc,
              OS: ubuntu-24.04,
              TARGET: x86_64-pc-windows-msvc,
            }
          - {
              NAME: win32-arm64-msvc,
              OS: ubuntu-24.04,
              TARGET: aarch64-pc-windows-msvc,
            }
          - {
              NAME: darwin-arm64,
              OS: macos-15,
              TARGET: aarch64-apple-darwin,
            }
          - {
              NAME: darwin-x64,
              OS: macos-15,
              TARGET: x86_64-apple-darwin,
            }
          - {
              NAME: linux-arm64,
              OS: ubuntu-24.04-arm,
              TARGET: aarch64-unknown-linux-musl,
              ZIG: 0.14.1,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/src" >> "$GITHUB_ENV"

      - name: Setup Maturin
        id: setup-maturin
        uses: $/.github/actions/setup-maturin
        with:
          target: ${{ matrix.build.TARGET }}
          rust_components: llvm-tools
          use_xwin: ${{ contains(matrix.build.TARGET, '-pc-windows-msvc') }}
          use_zigbuild: ${{ contains(matrix.build.TARGET, '-linux-') }}
          cache_directory: ${{ github.workspace }}/.xwin-cache
          use_cache: "false"

      - name: Build Python wheels (Linux manylinux with Zig)
        if: contains(matrix.build.TARGET, '-linux-') && contains(matrix.build.TARGET, '-gnu')
        working-directory: pypi
        env:
          CARGO: ${{ steps.setup-maturin.outputs.cargo_executable }}
          MANYLINUX: ${{ matrix.build.MANYLINUX }}
          TARGET: ${{ matrix.build.TARGET }}
          ZIG: ${{ matrix.build.ZIG }}
        run: |
          uvx --from "maturin==1.15.0" --with "ziglang==${ZIG}" \
            maturin build --release --target "${TARGET}" --zig \
            --compatibility "${MANYLINUX}" --out dist

      - name: Build Python wheels (Linux musllinux with Zig)
        if: contains(matrix.build.TARGET, '-linux-') && contains(matrix.build.TARGET, '-musl')
        working-directory: pypi
        env:
          CARGO: ${{ steps.setup-maturin.outputs.cargo_executable }}
          TARGET: ${{ matrix.build.TARGET }}
          ZIG: ${{ matrix.build.ZIG }}
        run: |
          uvx --from "maturin==1.15.0" --with "ziglang==${ZIG}" \
            maturin build --release --target "${TARGET}" --zig --out dist

      - name: Build Python wheels (Windows with Xwin)
        if: contains(matrix.build.TARGET, '-pc-windows-msvc')
        working-directory: pypi
        env:
          CARGO: ${{ steps.setup-maturin.outputs.cargo_executable }}
          MATURIN_USE_XWIN: "1"
          TARGET: ${{ matrix.build.TARGET }}
          XWIN_CACHE_DIR: ${{ steps.setup-maturin.outputs.xwin_cache_directory }}
          XWIN_CRT_VERSION: ${{ steps.setup-maturin.outputs.xwin_crt_version }}
          XWIN_SDK_VERSION: ${{ steps.setup-maturin.outputs.xwin_sdk_version }}
          XWIN_VERSION: ${{ steps.setup-maturin.outputs.xwin_version }}
        run: uvx --from maturin==1.15.0 maturin build --release --target "${TARGET}" --out dist

      - name: Build Python wheels (macOS)
        if: runner.os == 'macOS'
        working-directory: pypi
        env:
          CARGO: ${{ steps.setup-maturin.outputs.cargo_executable }}
          TARGET: ${{ matrix.build.TARGET }}
        run: |
          uvx --from maturin==1.15.0 maturin build --release \
            --target "${TARGET}" --out dist

      - name: Publish wheels to PyPI
        run: uv publish --trusted-publishing always pypi/dist/*.whl

  publish-source:
    name: Publish source distribution
    runs-on: ubuntu-24.04
    environment: pypi_release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.22"
          enable-cache: false

      - name: Build source distribution
        working-directory: pypi
        run: uv build --sdist --out-dir dist

      - name: Publish source distribution to PyPI
        run: uv publish --trusted-publishing always pypi/dist/*.tar.gz
