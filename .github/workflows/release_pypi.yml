name: Release to PyPI

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  # IMPORTANT: this permission is mandatory for Trusted Publishing
  id-token: write
  contents: read

jobs:
  publish-binaries:
    name: Publish binaries
    runs-on: ${{ matrix.build.os }}
    environment: pypi_release
    strategy:
      fail-fast: false
      matrix:
        build:
          # Linux wheels were omitted from the first 0.6.0 PyPI attempt and
          # are intentionally isolated here so existing filenames are not
          # uploaded again.
          - {
              NAME: linux-arm64,
              OS: ubuntu-24.04-arm,
              TOOLCHAIN: 1.94.1,
              TARGET: aarch64-unknown-linux-gnu,
              MANYLINUX: manylinux_2_28,
              ZIG: 0.14.1,
            }
          - {
              NAME: linux-arm64,
              OS: ubuntu-24.04-arm,
              TOOLCHAIN: 1.94.1,
              TARGET: aarch64-unknown-linux-musl,
              ZIG: 0.14.1,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.build.TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.build.TOOLCHAIN }}
          targets: ${{ matrix.build.TARGET }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.22"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.2
          fallback: none

      - name: Build Python wheels (Linux manylinux with Zig)
        if: runner.os == 'Linux' && contains(matrix.build.TARGET, '-gnu')
        working-directory: pypi
        run: |
          uvx --from maturin==1.12.3 --with ziglang==${{ matrix.build.ZIG }} \
            maturin build --release --target ${{ matrix.build.TARGET }} --zig \
            --compatibility ${{ matrix.build.MANYLINUX }} --out dist

      - name: Build Python wheels (Linux musllinux with Zig)
        if: runner.os == 'Linux' && contains(matrix.build.TARGET, '-musl')
        working-directory: pypi
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          uvx --from maturin==1.12.3 --with ziglang==${{ matrix.build.ZIG }} \
            maturin build --release --target ${{ matrix.build.TARGET }} --zig --out dist

      - name: Publish wheels to PyPI
        run: uv publish --trusted-publishing always pypi/dist/*.whl
