# Release workflow for celq binaries
# Credit: Inspired by https://github.com/01mf02/jaq/blob/main/.github/workflows/release.yml
# Also see: https://github.com/BurntSushi/ripgrep/blob/61733f6378b62fa2dc2e7f3eff2f2e7182069ca9/.github/workflows/release.yml


name: GitHub Release

on:
  workflow_dispatch:  # Manual trigger only
  push:
    tags:
      - "v[0-9]*"      # Trigger on version tags like v1.0.0

defaults:
  run:
    shell: bash

env:
  NAME: celq
  VERSION: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build_mac:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    environment: github_release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (native)
          - { target: aarch64-apple-darwin, os: macos-15, pretty_target: macos-aarch64 }

          # macOS x86-64 (cross-compiled on Apple Silicon)
          - { target: x86_64-apple-darwin, os: macos-15, pretty_target: macos-x86_64 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/src" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-auditable
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Build
        run: cargo auditable build --locked --release --target ${{ matrix.target }}

      - name: Create release archive
        id: archive
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${NAME}"
          ARCHIVE_NAME="${NAME}-${{ matrix.pretty_target }}.tar.gz"
          tar czf "${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" "${NAME}"
          
          echo "BIN_PATH=${BIN_PATH}" >> $GITHUB_OUTPUT
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Generate attestation for release binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.BIN_PATH }}

      - name: Generate attestation for release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.ARCHIVE_NAME }}

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${VERSION} ${{ steps.archive.outputs.ARCHIVE_NAME }}

  build_xwin:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    environment: github_release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, pretty_target: windows-x86_64 }
          - { target: aarch64-pc-windows-msvc, pretty_target: windows-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/src" >> "$GITHUB_ENV"

      - name: Setup Xwin
        id: setup-xwin
        uses: $/.github/actions/setup-xwin
        with:
          target: ${{ matrix.target }}
          rust_components: llvm-tools
          cache_directory: ${{ github.workspace }}/.xwin-cache
          use_cache: "false"

      - name: Build with Xwin
        env:
          TARGET: ${{ matrix.target }}
          XWIN_CRT_VERSION: ${{ steps.setup-xwin.outputs.xwin_crt_version }}
          XWIN_SDK_VERSION: ${{ steps.setup-xwin.outputs.xwin_sdk_version }}
          XWIN_VERSION: ${{ steps.setup-xwin.outputs.xwin_version }}
        run: >-
          cargo auditable xwin build --locked --release --target "${TARGET}"
          --xwin-version "${XWIN_VERSION}"
          --xwin-sdk-version "${XWIN_SDK_VERSION}"
          --xwin-crt-version "${XWIN_CRT_VERSION}"

      - name: Create release archive
        id: archive
        env:
          PRETTY_TARGET: ${{ matrix.pretty_target }}
          TARGET: ${{ matrix.target }}
        run: |
          BIN_PATH="target/${TARGET}/release/${NAME}.exe"
          ARCHIVE_NAME="${NAME}-${PRETTY_TARGET}.zip"
          7z a "${ARCHIVE_NAME}" "./${BIN_PATH}"
          7z rn "${ARCHIVE_NAME}" "target/${TARGET}/release/${NAME}.exe" "${NAME}.exe"

          echo "BIN_PATH=${BIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate attestation for release binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.BIN_PATH }}

      - name: Generate attestation for release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.ARCHIVE_NAME }}

      - name: Upload release archive
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.ARCHIVE_NAME }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${VERSION}" "${ARCHIVE_NAME}"

  build:
    name: ${{ matrix.target }}${{ matrix.zigtargetsuffix }}
    runs-on: ubuntu-24.04
    environment: github_release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64 (zigbuild - glibc 2.28)
          - { target: x86_64-unknown-linux-gnu, zigtargetsuffix: .2.28, pretty_target: linux-x86_64-gnu }
          
          # Linux ARM64 (zigbuild - glibc 2.28)
          - { target: aarch64-unknown-linux-gnu, zigtargetsuffix: .2.28, pretty_target: linux-aarch64-gnu }

          # Linux RISC-V 64 (zigbuild - glibc 2.31)
          - { target: riscv64gc-unknown-linux-gnu, zigtargetsuffix: .2.31, pretty_target: linux-riscv64-gnu }

          # Linux RISC-V 64 (zigbuild - musl static binary)
          - { target: riscv64gc-unknown-linux-musl, zigtargetsuffix: "", pretty_target: linux-riscv64-musl }

          # Linux x86-64 (zigbuild - musl static binary)
          - { target: x86_64-unknown-linux-musl, zigtargetsuffix: "", pretty_target: linux-x86_64-musl }

          # Linux ARM64 (zigbuild - musl static binary)
          - { target: aarch64-unknown-linux-musl, zigtargetsuffix: "", pretty_target: linux-aarch64-musl }

          # FreeBSD x86-64 (zigbuild)
          - { target: x86_64-unknown-freebsd, zigtargetsuffix: "", pretty_target: freebsd-x86_64 }

          # FreeBSD ARM64 (zigbuild)
          - { target: aarch64-unknown-freebsd, zigtargetsuffix: "", pretty_target: freebsd-aarch64 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/src" >> "$GITHUB_ENV"

      - name: Setup Zigbuild
        uses: $/.github/actions/setup-zigbuild
        with:
          target: ${{ matrix.target }}
          rust_components: rust-src
          install_target: ${{ matrix.target != 'aarch64-unknown-freebsd' }}
          use_cache: "false"

      - name: Build with Zig
        if: matrix.target != 'aarch64-unknown-freebsd'
        run: cargo auditable zigbuild --locked --release --target ${{ matrix.target }}${{ matrix.zigtargetsuffix }}
      
      - name: Build with Zig (FreeBSD aarch64 special case)
        if: matrix.target == 'aarch64-unknown-freebsd'
        run: |
          RUSTC_BOOTSTRAP=1 RUSTFLAGS="${RUSTFLAGS} -Z unstable-options -C panic=immediate-abort" cargo auditable zigbuild \
          --target aarch64-unknown-freebsd \
          --release \
          -Z build-std=std,panic_abort

      - name: Create release archive
        id: archive
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${NAME}"
          BIN_NAME="${NAME}"
          
          # Archive name uses pretty target name
          ARCHIVE_NAME="${NAME}-${{ matrix.pretty_target }}.tar.gz"
          tar czf "${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" "${BIN_NAME}"
          
          echo "BIN_PATH=${BIN_PATH}" >> $GITHUB_OUTPUT
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Generate attestation for release binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.BIN_PATH }}

      - name: Generate attestation for release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.ARCHIVE_NAME }}

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${VERSION} ${{ steps.archive.outputs.ARCHIVE_NAME }}

  update-install-script:
    name: Update install script on GitHub Pages
    needs: [build, build_mac, build_xwin]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: $/.github/workflows/release_sub_pages.yml

  generate-checksums:
    name: Generate SHA256 checksums
    runs-on: ubuntu-latest
    needs: [build, build_mac, build_xwin, update-install-script]
    environment: github_release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          
          # Create temp directory for downloads
          mkdir -p /tmp/release-assets
          cd /tmp/release-assets
          
          # Download all archives and install.sh for this release
          gh release download "${VERSION}" \
            --repo ${{ github.repository }} \
            --pattern "celq-*.tar.gz" \
            --pattern "celq-*.zip" \
            --pattern "install.sh"
          
          # List downloaded files
          echo "Downloaded files:"
          ls -lh

      - name: Generate checksums file
        run: |
          cd /tmp/release-assets
          
          # Generate SHA256 checksums for all downloaded files
          # Sort output alphabetically by filename
          sha256sum celq-* install.sh | sort -k2 > SHA256SUMS
          
          echo "Generated checksums:"
          cat SHA256SUMS

      - name: Generate attestation for checksums file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: /tmp/release-assets/SHA256SUMS

      - name: Upload checksums file to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/release-assets
          gh release upload ${{ github.ref_name }} SHA256SUMS \
            --repo ${{ github.repository }} \
            --clobber

  generate-sboms:
    name: SBOM (${{ matrix.target }})
    needs: [generate-checksums]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, archive: celq-macos-aarch64.tar.gz, binary: celq }
          - { target: macos-x86_64, archive: celq-macos-x86_64.tar.gz, binary: celq }
          - { target: windows-x86_64, archive: celq-windows-x86_64.zip, binary: celq.exe }
          - { target: windows-arm64, archive: celq-windows-arm64.zip, binary: celq.exe }
          - { target: linux-x86_64-musl, archive: celq-linux-x86_64-musl.tar.gz, binary: celq }
          - { target: linux-aarch64-musl, archive: celq-linux-aarch64-musl.tar.gz, binary: celq }
          - { target: linux-x86_64-gnu, archive: celq-linux-x86_64-gnu.tar.gz, binary: celq }
          - { target: linux-aarch64-gnu, archive: celq-linux-aarch64-gnu.tar.gz, binary: celq }
          - { target: linux-riscv64-gnu, archive: celq-linux-riscv64-gnu.tar.gz, binary: celq }
          - { target: linux-riscv64-musl, archive: celq-linux-riscv64-musl.tar.gz, binary: celq }
          - { target: freebsd-x86_64, archive: celq-freebsd-x86_64.tar.gz, binary: celq }
          - { target: freebsd-aarch64, archive: celq-freebsd-aarch64.tar.gz, binary: celq }
    uses: $/.github/workflows/release_sub_calculate_sboms.yml
    with:
      target: ${{ matrix.target }}
      archive: ${{ matrix.archive }}
      binary: ${{ matrix.binary }}

  attest-sboms:
    name: Attest SBOM (${{ matrix.target }})
    needs: [generate-sboms]
    runs-on: ubuntu-latest
    environment: github_release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, binary: celq }
          - { target: macos-x86_64, binary: celq }
          - { target: windows-x86_64, binary: celq.exe }
          - { target: windows-arm64, binary: celq.exe }
          - { target: linux-x86_64-musl, binary: celq }
          - { target: linux-aarch64-musl, binary: celq }
          - { target: linux-x86_64-gnu, binary: celq }
          - { target: linux-aarch64-gnu, binary: celq }
          - { target: linux-riscv64-gnu, binary: celq }
          - { target: linux-riscv64-musl, binary: celq }
          - { target: freebsd-x86_64, binary: celq }
          - { target: freebsd-aarch64, binary: celq }
    steps:
      - name: Download SBOM attestation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-attestation-${{ matrix.target }}

      - name: Attest binary SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: binary/${{ matrix.binary }}
          sbom-path: ${{ needs.generate-sboms.outputs.spdx_json_path }}

      - name: Attest binary CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: binary/${{ matrix.binary }}
          sbom-path: ${{ needs.generate-sboms.outputs.cyclonedx_json_path }}

  update-homebrew-formula:
    name: Update Homebrew formula
    needs: [build, build_mac, build_xwin]
    permissions:
      contents: read
    uses: $/.github/workflows/release_sub_homebrew.yml

  update-scoop-manifest:
    name: Update Scoop manifest
    needs: [build, build_mac, build_xwin]
    permissions:
      contents: read
    uses: $/.github/workflows/release_sub_scoop.yml
