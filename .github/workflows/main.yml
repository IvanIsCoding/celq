name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Linux x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      
      - name: Build with locked dependencies
        run: cargo build --locked
      
      - name: Build with no-default-features
        run: cargo build --locked --no-default-features

  format:
    name: Format Check
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        with:
          components: clippy
      
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: [build, format, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust: stable
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rust: stable
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust: stable
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rust: stable
          - os: macos-15
            target: aarch64-apple-darwin
            rust: stable
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rust: stable
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      
      - name: Install musl tools (for musl targets)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      
      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

  features:
    name: Feature matrix (${{ matrix.features }})
    needs: [build, format, clippy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features from-toml"
          - "--no-default-features --features from-yaml"
          - "--no-default-features --features from-xml"
          - "--no-default-features --features greppable"
          - "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1

      - name: Run tests
        run: cargo test --locked ${{ matrix.features }}

  docs:
    name: Documentation
    needs: [build, format, clippy]
    permissions:
      contents: read
    uses: $/.github/workflows/sub_docs.yml

  zigbuild:
    name: Zig Build (${{ matrix.target }})
    needs: [build, format, clippy]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            target: x86_64-unknown-linux-gnu
            zigtargetsuffix: .2.28
          - arch: ARM
            target: aarch64-unknown-linux-gnu
            zigtargetsuffix: .2.28
          - arch: x86-64
            target: x86_64-unknown-linux-musl
            zigtargetsuffix: ""
          - arch: ARM
            target: aarch64-unknown-linux-musl
            zigtargetsuffix: ""
          - arch: RISC-V 64
            target: riscv64gc-unknown-linux-gnu
            zigtargetsuffix: .2.31
          - arch: RISC-V 64
            target: riscv64gc-unknown-linux-musl
            zigtargetsuffix: ""
          - arch: x86-64
            target: x86_64-unknown-freebsd
            zigtargetsuffix: ""
          - arch: ARM
            target: aarch64-unknown-freebsd
            zigtargetsuffix: ""
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Zigbuild
        uses: $/.github/actions/setup-zigbuild
        with:
          target: ${{ matrix.target }}
          rust_components: rust-src
          install_target: ${{ matrix.target != 'aarch64-unknown-freebsd' }}
          use_cache: "true"

      - name: Build with Zig
        if: matrix.target != 'aarch64-unknown-freebsd'
        run: cargo auditable zigbuild --locked --target ${{ matrix.target }}${{ matrix.zigtargetsuffix }}
      
      - name: Build with Zig (FreeBSD aarch64 special case)
        if: matrix.target == 'aarch64-unknown-freebsd'
        run: |
          RUSTC_BOOTSTRAP=1 RUSTFLAGS="-Z unstable-options -C panic=immediate-abort" cargo auditable zigbuild \
          --target aarch64-unknown-freebsd \
          -Z build-std=std,panic_abort

      - name: Upload celq binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: celq-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/celq
          retention-days: 1

  xwin:
    name: Xwin Build (${{ matrix.target }})
    needs: [build, format, clippy]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Xwin
        id: setup-xwin
        uses: $/.github/actions/setup-xwin
        with:
          target: ${{ matrix.target }}
          rust_components: llvm-tools
          cache_directory: ${{ github.workspace }}/.xwin-cache
          use_cache: "true"

      - name: Print LLVM tools used by cargo-xwin
        run: |
          command -v clang
          clang --version
          command -v clang-cl
          clang-cl --version
          command -v lld-link
          lld-link --version
          command -v llvm-lib
          llvm-lib --version

      - name: Build with Xwin
        env:
          TARGET: ${{ matrix.target }}
          XWIN_CACHE_DIR: ${{ steps.setup-xwin.outputs.cache_directory }}
          XWIN_CRT_VERSION: ${{ steps.setup-xwin.outputs.xwin_crt_version }}
          XWIN_SDK_VERSION: ${{ steps.setup-xwin.outputs.xwin_sdk_version }}
          XWIN_VERSION: ${{ steps.setup-xwin.outputs.xwin_version }}
        run: >-
          cargo auditable xwin build --locked --target "${TARGET}"
          --xwin-version "${XWIN_VERSION}"
          --xwin-sdk-version "${XWIN_SDK_VERSION}"
          --xwin-crt-version "${XWIN_CRT_VERSION}"
          --xwin-cache-dir "${XWIN_CACHE_DIR}"

      - name: Upload celq binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: celq-${{ matrix.target }}-xwin
          path: target/${{ matrix.target }}/debug/celq.exe
          retention-days: 1

  test-xwin-binaries:
    name: Test Xwin-built Windows binaries
    needs: xwin
    permissions:
      contents: read
    uses: $/.github/workflows/sub_test_xwin.yml

  audit-cross-compiled-binaries:
    name: Audit cross-compiled x86-64 binaries
    needs: [zigbuild, xwin]
    permissions:
      contents: read
    uses: $/.github/workflows/sub_audit_cross_compiled_binaries.yml

  test-maturin-auditable:
    name: Test Maturin with cargo-auditable (${{ matrix.name }})
    needs: [zigbuild, xwin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86-64
            os: ubuntu-24.04
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Maturin
        id: setup-maturin
        uses: $/.github/actions/setup-maturin
        with:
          target: ${{ matrix.target }}
          rust_components: llvm-tools
          use_xwin: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
          use_zigbuild: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
          cache_directory: ${{ github.workspace }}/.xwin-cache
          use_cache: "true"

      - name: Build Python wheel with Maturin (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: pypi
        env:
          CARGO: ${{ steps.setup-maturin.outputs.cargo_executable }}
          TARGET: ${{ matrix.target }}
        run: |
          uvx --from maturin==1.15.0 maturin build --release \
            --target "${TARGET}" --zig \
            --compatibility manylinux_2_28 --out dist

      - name: Build Python wheel with Maturin (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: pypi
        env:
          CARGO: ${{ steps.setup-maturin.outputs.cargo_executable }}
          MATURIN_USE_XWIN: "1"
          TARGET: ${{ matrix.target }}
          XWIN_CACHE_DIR: ${{ steps.setup-maturin.outputs.xwin_cache_directory }}
          XWIN_CRT_VERSION: ${{ steps.setup-maturin.outputs.xwin_crt_version }}
          XWIN_SDK_VERSION: ${{ steps.setup-maturin.outputs.xwin_sdk_version }}
          XWIN_VERSION: ${{ steps.setup-maturin.outputs.xwin_version }}
        run: uvx --from maturin==1.15.0 maturin build --release --target "${TARGET}" --out dist

  test-debian-oldoldstable:
    name: Test on Debian Oldoldstable
    needs: zigbuild
    permissions:
      contents: read
    uses: $/.github/workflows/sub_test_debian_oldoldstable.yml

  test-freebsd:
    name: Test on FreeBSD
    needs: zigbuild
    permissions:
      contents: read
    uses: $/.github/workflows/sub_test_freebsd.yml

  test-debian-riscv64:
    name: Test on Debian 13 RISC-V 64
    needs: zigbuild
    permissions:
      contents: read
    uses: $/.github/workflows/sub_test_riscv64.yml


  coverage:
    name: Code Coverage (Ubuntu 24.04 x86-64)
    needs: [build, format, clippy]
    permissions:
      contents: read
    uses: $/.github/workflows/sub_code_coverage.yml
  
  openbsd:
    name: OpenBSD (QEMU)
    needs: [build, format, clippy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: $/.github/workflows/sub_openbsd.yml
    
  netbsd:
    name: NetBSD (QEMU)
    needs: [build, format, clippy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: $/.github/workflows/sub_netbsd.yml

  freebsd:
    name: FreeBSD (QEMU)
    needs: [build, format, clippy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: $/.github/workflows/sub_freebsd.yml
