name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Linux x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      
      - name: Build with locked dependencies
        run: cargo build --locked
      
      - name: Build with no-default-features
        run: cargo build --locked --no-default-features

  format:
    name: Format Check
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        with:
          components: clippy
      
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: [build, format, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust: stable
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rust: stable
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust: stable
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rust: stable
          - os: macos-15
            target: aarch64-apple-darwin
            rust: stable
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rust: stable
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      
      - name: Install musl tools (for musl targets)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      
      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

  features:
    name: Feature matrix (${{ matrix.features }})
    needs: [build, format, clippy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features from-toml"
          - "--no-default-features --features from-yaml"
          - "--no-default-features --features from-xml"
          - "--no-default-features --features greppable"
          - "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1

      - name: Run tests
        run: cargo test --locked ${{ matrix.features }}

  docs:
    name: Documentation
    needs: [build, format, clippy]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      
      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation
          path: target/doc/
          retention-days: 1

  zigbuild:
    name: Zig Build (${{ matrix.target }})
    needs: [build, format, clippy]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            target: x86_64-unknown-linux-gnu
            zigtargetsuffix: .2.28
          - arch: ARM
            target: aarch64-unknown-linux-gnu
            zigtargetsuffix: .2.28
          - arch: x86-64
            target: x86_64-unknown-linux-musl
            zigtargetsuffix: ""
          - arch: ARM
            target: aarch64-unknown-linux-musl
            zigtargetsuffix: ""
          - arch: RISC-V 64
            target: riscv64gc-unknown-linux-gnu
            zigtargetsuffix: .2.31
          - arch: RISC-V 64
            target: riscv64gc-unknown-linux-musl
            zigtargetsuffix: ""
          - arch: x86-64
            target: x86_64-unknown-freebsd
            zigtargetsuffix: ""
          - arch: ARM
            target: aarch64-unknown-freebsd
            zigtargetsuffix: ""
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: matrix.target != 'aarch64-unknown-freebsd'
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rust-src
      
      - name: Install Rust 1.94.1 (FreeBSD aarch64 special case)
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        if: matrix.target == 'aarch64-unknown-freebsd'
        with:
          components: rust-src
      
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      
      - name: Install cargo-zigbuild via cargo-binstall
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-zigbuild@0.23.2

      - name: Install cargo-auditable
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-auditable@0.7.5
          fallback: none
      
      - name: Build with Zig
        if: matrix.target != 'aarch64-unknown-freebsd'
        run: cargo auditable zigbuild --locked --target ${{ matrix.target }}${{ matrix.zigtargetsuffix }}
      
      - name: Build with Zig (FreeBSD aarch64 special case)
        if: matrix.target == 'aarch64-unknown-freebsd'
        run: |
          RUSTC_BOOTSTRAP=1 RUSTFLAGS="-Z unstable-options -C panic=immediate-abort" cargo auditable zigbuild \
          --target aarch64-unknown-freebsd \
          -Z build-std=std,panic_abort

      - name: Upload celq binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: celq-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/celq
          retention-days: 1

  xwin:
    name: Xwin Build (${{ matrix.target }})
    needs: [build, format, clippy]
    runs-on: ubuntu-24.04
    env:
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "21.1.8"

      - name: Print LLVM tools used by cargo-xwin
        run: |
          command -v clang
          clang --version
          command -v clang-cl
          clang-cl --version
          command -v lld-link
          lld-link --version
          command -v llvm-lib
          llvm-lib --version

      - name: Calculate seven-day cache bucket
        id: xwin-cache-key
        run: echo "bucket=$(($(date -u +%s) / 604800))" >> "$GITHUB_OUTPUT"

      - name: Restore cargo-xwin downloads
        id: xwin-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: cargo-xwin-${{ runner.os }}-v0.23.1-msvc17-sdk10.0.26100-crt14.44.17.14-${{ steps.xwin-cache-key.outputs.bucket }}

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools

      - name: Install cargo-xwin
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-xwin@0.23.1
          fallback: none

      - name: Pre-cache Microsoft CRT and Windows SDK
        run: >-
          cargo xwin cache xwin
          --xwin-version 17
          --xwin-sdk-version 10.0.26100
          --xwin-crt-version 14.44.17.14
          --xwin-cache-dir "${XWIN_CACHE_DIR}"

      - name: Save cargo-xwin downloads
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: cargo-xwin-${{ runner.os }}-v0.23.1-msvc17-sdk10.0.26100-crt14.44.17.14-${{ steps.xwin-cache-key.outputs.bucket }}

      - name: Install cargo-auditable
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Build with Xwin
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          cargo auditable xwin build --locked --target "${TARGET}"
          --xwin-version 17
          --xwin-sdk-version 10.0.26100
          --xwin-crt-version 14.44.17.14
          --xwin-cache-dir "${XWIN_CACHE_DIR}"

      - name: Upload celq binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: celq-${{ matrix.target }}-xwin
          path: target/${{ matrix.target }}/debug/celq.exe
          retention-days: 1

  test-xwin-binaries:
    name: Test Xwin-built Windows binary (${{ matrix.arch }})
    needs: xwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: ARM64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download celq binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: celq-${{ matrix.target }}-xwin
          path: ./bin

      - name: Print runner Windows toolchain versions
        shell: pwsh
        run: ./.github/scripts/print-windows-toolchain-versions.ps1

      - name: Print celq version
        run: ./bin/celq.exe --version

      - name: Run smoke test
        run: sh .github/scripts/smoke-test.sh ./bin/celq.exe

  audit-cross-compiled-binaries:
    name: Audit cross-compiled x86-64 binaries
    needs: [zigbuild, xwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download Linux celq binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: celq-x86_64-unknown-linux-gnu
          path: ./bin/linux

      - name: Download Windows celq binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: celq-x86_64-pc-windows-msvc-xwin
          path: ./bin/windows

      - name: Install cargo-audit
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Print Linux binary packages
        run: '"${{ steps.syft.outputs.cmd }}" scan ./bin/linux/celq --output table' # zizmor: ignore[template-injection] command path comes from the pinned Syft action

      - name: Print Windows binary packages
        run: '"${{ steps.syft.outputs.cmd }}" scan ./bin/windows/celq.exe --output table' # zizmor: ignore[template-injection] command path comes from the pinned Syft action

      - name: Generate SBOMs from cargo-auditable binaries
        run: |
          "${{ steps.syft.outputs.cmd }}" scan ./bin/linux/celq --output spdx-json=celq-linux.spdx.json
          "${{ steps.syft.outputs.cmd }}" scan ./bin/windows/celq.exe --output spdx-json=celq-windows.spdx.json
        # zizmor: ignore[template-injection] command path comes from the pinned Syft action

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: celq-spdx-sboms
          path: celq-*.spdx.json
          retention-days: 1

      - name: Audit binaries
        run: |
          .github/scripts/audit-binary.sh ./bin/linux/celq
          .github/scripts/audit-binary.sh ./bin/windows/celq.exe

  test-maturin-auditable:
    name: Test Maturin with cargo-auditable (${{ matrix.name }})
    needs: [zigbuild, xwin]
    env:
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
      XWIN_VERSION: "17"
      XWIN_SDK_VERSION: "10.0.26100"
      XWIN_CRT_VERSION: "14.44.17.14"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86-64
            os: ubuntu-24.04
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install LLVM and Clang
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "21.1.8"

      - name: Calculate seven-day cache bucket
        if: matrix.target == 'x86_64-pc-windows-msvc'
        id: xwin-cache-key
        run: echo "bucket=$(($(date -u +%s) / 604800))" >> "$GITHUB_OUTPUT"

      - name: Restore cargo-xwin downloads
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: cargo-xwin-${{ runner.os }}-v0.23.1-msvc17-sdk10.0.26100-crt14.44.17.14-${{ steps.xwin-cache-key.outputs.bucket }}

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.22"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install cargo-zigbuild
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-zigbuild@0.23.2
          fallback: none

      - name: Install cargo-auditable
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Configure Maturin to use cargo-auditable
        run: echo "CARGO=$GITHUB_WORKSPACE/.github/scripts/cargo-auditable-wrapper.sh" >> "$GITHUB_ENV"

      - name: Build Python wheel with Maturin (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: pypi
        env:
          TARGET: ${{ matrix.target }}
        run: |
          uvx --from maturin==1.15.0 --with ziglang==0.15.1 \
            maturin build --release --target "${TARGET}" --zig \
            --compatibility manylinux_2_28 --out dist

      - name: Build Python wheel with Maturin (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: pypi
        env:
          MATURIN_USE_XWIN: "1"
          TARGET: ${{ matrix.target }}
        run: uvx --from maturin==1.15.0 maturin build --release --target "${TARGET}" --out dist

  test-debian-oldoldstable:
    name: Test on Debian Oldoldstable (${{ matrix.arch }})
    needs: zigbuild
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86-64
            gnu_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: ARM64
            gnu_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    container:
      image: debian:oldoldstable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Download GNU celq binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: celq-${{ matrix.gnu_target }}
          path: ./bin

      - name: Rename GNU celq binary
        run: mv ./bin/celq ./bin/celq-gnu

      - name: Download musl celq binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: celq-${{ matrix.musl_target }}
          path: ./bin

      - name: Rename musl celq binary
        run: mv ./bin/celq ./bin/celq-musl
      
      - name: Make binaries executable
        run: chmod +x ./bin/celq-gnu ./bin/celq-musl
      
      - name: Run smoke tests
        run: |
          sh .github/scripts/smoke-test.sh ./bin/celq-gnu
          sh .github/scripts/smoke-test.sh ./bin/celq-musl

  test-freebsd:
    name: Test on FreeBSD (${{ matrix.release }} – ${{ matrix.arch }})
    needs: zigbuild
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - release: "14.4"
            arch: x86_64
            artifact: celq-x86_64-unknown-freebsd
          - release: "14.4"
            arch: aarch64
            artifact: celq-aarch64-unknown-freebsd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download celq binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          run: |
            chmod +x ./bin/celq
            sh .github/scripts/smoke-test.sh ./bin/celq

  test-debian-riscv64:
    name: Test on Debian 13 (${{ matrix.target }})
    needs: zigbuild
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download celq binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: celq-${{ matrix.target }}
          path: ./bin

      - name: Test on Debian
        uses: vmactions/debian-vm@389ba1da28ff5b440cba52db8e03fc2e08e2affa # v1.0.0
        with:
          release: "13"
          arch: riscv64
          run: |
            chmod +x ./bin/celq
            sh .github/scripts/smoke-test.sh ./bin/celq


  coverage:
    name: Code Coverage (Ubuntu 24.04 x86-64)
    needs: [build, format, clippy]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov via binstall
