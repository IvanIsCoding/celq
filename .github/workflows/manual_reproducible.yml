name: Reproducible builds (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  patched_cargo:
    name: Patched Cargo (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, x86_64-unknown-freebsd]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout Cargo source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rust-lang/cargo
          ref: 29ea6fb6a5db279426f4cc4e17aa385f05a0cfbc
          path: cargo-source
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            src
            crates
            credential
            benches/benchsuite
            benches/capture

      - name: Setup Zigbuild
        uses: $/.github/actions/setup-zigbuild
        with:
          target: ${{ matrix.target }}
          rust_components: rust-src
          install_target: "true"
          use_cache: "false"

      - name: Patch Cargo
        working-directory: cargo-source
        run: |
          git apply --check ../.github/reproducibility/patches/cargo-linux-x86_64-metadata.patch
          git apply ../.github/reproducibility/patches/cargo-linux-x86_64-metadata.patch

      - name: Build patched Cargo with Zig
        working-directory: cargo-source
        env:
          CFG_RELEASE: 1.94.1
          CFG_RELEASE_CHANNEL: stable
          CFG_VER_DESCRIPTION: linux-x86_64-metadata-patch
          LIBZ_SYS_STATIC: "1"
        run: |
          cargo zigbuild --locked --release --package cargo --bin cargo --features all-static --target "$TARGET"

      - name: Upload patched Cargo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-cargo-${{ matrix.target }}
          path: cargo-source/target/${{ matrix.target }}/release/cargo
          retention-days: 1
          if-no-files-found: error

  zigbuild:
    name: Zigbuild (${{ matrix.runner }}, ${{ matrix.build.target }}${{ matrix.build.zigtargetsuffix }})
    needs: patched_cargo
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        build: &targets
          - target: x86_64-unknown-linux-gnu
            zigtargetsuffix: .2.28
    env:
      TARGET: ${{ matrix.build.target }}
      ZIGTARGETSUFFIX: ${{ matrix.build.zigtargetsuffix }}
    steps:
      # Every host builds the same HEAD captured by the manual dispatch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download patched Cargo
        if: matrix.runner == 'ubuntu-24.04-arm'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: patched-cargo-aarch64-unknown-linux-gnu
          path: patched-cargo

      - name: Setup Zigbuild
        uses: $/.github/actions/setup-zigbuild
        with:
          target: ${{ matrix.build.target }}
          rust_components: rust-src
          install_target: "true"
          use_cache: "false"

      - name: Select patched Cargo
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          chmod +x "$GITHUB_WORKSPACE/patched-cargo/cargo"
          echo "$GITHUB_WORKSPACE/patched-cargo" >> "$GITHUB_PATH"
          echo "CARGO=$GITHUB_WORKSPACE/patched-cargo/cargo" >> "$GITHUB_ENV"

      - name: Verify patched Cargo selection
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          test "$(command -v cargo)" = "$CARGO"
          echo "Using patched Cargo: $CARGO"

      - name: Configure reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          RUST_SYSROOT=$(rustc --print sysroot)
          echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUST_SYSROOT}=/rust-toolchain --remap-path-prefix=${GITHUB_WORKSPACE}=/src" >> "$GITHUB_ENV"

      - name: Build with Zig
        run: |
          rustc -vV
          cargo -vV
          cargo zigbuild -vv --locked --release --no-default-features --features from-toml,from-yaml,greppable,from-xml --target "${TARGET}${ZIGTARGETSUFFIX}"

      - name: Create release archive
        run: |
          mkdir -p artifacts
          cp "target/${TARGET}/release/celq" artifacts/celq
          tar czf artifacts/celq.tar.gz -C "target/${TARGET}/release" celq

      - name: Upload archive and binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducible-${{ matrix.build.target }}${{ matrix.build.zigtargetsuffix }}-${{ matrix.runner }}
          retention-days: 1
          path: |
            artifacts/celq
            artifacts/celq.tar.gz
          if-no-files-found: error
          compression-level: 0

  freebsd:
    name: Zigbuild (FreeBSD x86-64, ${{ matrix.build.target }}${{ matrix.build.zigtargetsuffix }})
    needs: patched_cargo
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: *targets
    env:
      TARGET: ${{ matrix.build.target }}
      ZIGTARGETSUFFIX: ${{ matrix.build.zigtargetsuffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Capture commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Download patched Cargo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: patched-cargo-x86_64-unknown-freebsd
          path: patched-cargo

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "14.4"
          arch: x86_64
          sync: rsync
          copyback: true
          envs: TARGET ZIGTARGETSUFFIX SOURCE_DATE_EPOCH
          prepare: |
            set -eu
            pkg install -y ca_root_nss git devel/rustup-init

            # Install the official FreeBSD Zig archive directly from ziglang.org.
            cd /tmp
            fetch https://ziglang.org/download/0.15.2/zig-x86_64-freebsd-0.15.2.tar.xz
            test "$(sha256 -q zig-x86_64-freebsd-0.15.2.tar.xz)" = \
              "5509ff57cd3f219165caed0da10221739af82742b9edfcda3f7bfaf4da7212dd"
            tar -xf zig-x86_64-freebsd-0.15.2.tar.xz

            rustup-init -y --profile minimal --default-toolchain 1.94.1
            . "$HOME/.cargo/env"
            rustup component add rust-src --toolchain 1.94.1

            # Match setup-zigbuild's versions, compiling the tools from crates.io.
            cargo +1.94.1 install cargo-zigbuild --version 0.23.2 --locked
            cargo +1.94.1 install cargo-auditable --version 0.7.5 --locked
          run: |
            set -eu
            . "$HOME/.cargo/env"
            export PATH="/tmp/zig-x86_64-freebsd-0.15.2:$PATH"
            rustup target add --toolchain 1.94.1 "$TARGET"

            # Host job environment variables are not inherited by the VM.
            export RUSTUP_TOOLCHAIN=1.94.1
            export CARGO_TERM_COLOR=always TZ=UTC LC_ALL=C
            export SOURCE_DATE_EPOCH
            RUST_SYSROOT=$(rustc --print sysroot)
            export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUST_SYSROOT}=/rust-toolchain --remap-path-prefix=$(pwd -P)=/src"
            export CARGO="$(pwd -P)/patched-cargo/cargo"
            chmod +x "$CARGO"
            export PATH="$(pwd -P)/patched-cargo:$PATH"
            test "$(command -v cargo)" = "$CARGO"
            echo "Using patched Cargo: $CARGO"
            rustc -vV
            "$CARGO" -vV
            "$CARGO" zigbuild -vv --locked --release --no-default-features --features from-toml,from-yaml,greppable,from-xml --target "${TARGET}${ZIGTARGETSUFFIX}"

            mkdir -p artifacts
            cp "target/${TARGET}/release/celq" artifacts/celq
            tar czf artifacts/celq.tar.gz -C "target/${TARGET}/release" celq

      - name: Upload archive and binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducible-${{ matrix.build.target }}${{ matrix.build.zigtargetsuffix }}-freebsd-x86_64
          retention-days: 1
          path: |
            artifacts/celq
            artifacts/celq.tar.gz
          if-no-files-found: error
          compression-level: 0

  hashes:
    name: Print SHA-256 hashes
    needs: [zigbuild, freebsd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all host artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: reproducible-*
          path: artifacts

      - name: Print SHA-256 hashes
        run: find artifacts -type f -exec sha256sum {} +
