name: Reproducible builds (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux_native:
    name: Build from Linux x86-64
    uses: $/.github/workflows/sub_reproducible_from_linux.yml
    with:
      source_ref: ${{ github.sha }}
      runner: ubuntu-24.04
      use_cache: true

  linux_arm:
    name: Build from Linux ARM64
    uses: $/.github/workflows/sub_reproducible_from_linux.yml
    with:
      source_ref: ${{ github.sha }}
      runner: ubuntu-24.04-arm
      use_cache: true

  freebsd:
    name: Build from FreeBSD x86-64
    uses: $/.github/workflows/sub_reproducible_from_freebsd.yml
    with:
      source_ref: ${{ github.sha }}
      use_cache: true

  windows_native:
    name: Build from Windows x86-64
    uses: $/.github/workflows/sub_reproducible_from_windows.yml
    with:
      source_ref: ${{ github.sha }}
      runner: windows-2025
      use_cache: true

  windows_arm:
    name: Build from Windows ARM64
    uses: $/.github/workflows/sub_reproducible_from_windows.yml
    with:
      source_ref: ${{ github.sha }}
      runner: windows-11-vs2026-arm
      use_cache: true

  macos_native:
    name: Build from macOS ARM64
    uses: $/.github/workflows/sub_reproducible_from_mac.yml
    with:
      source_ref: ${{ github.sha }}
      runner: macos-15

  macos_intel:
    name: Build from Intel macOS
    uses: $/.github/workflows/sub_reproducible_from_mac.yml
    with:
      source_ref: ${{ github.sha }}
      runner: macos-15-intel

  linux_hashes:
    name: SHA-256 (${{ matrix.pretty_target }}, Linux x86-64 vs ${{ matrix.verify_host }})
    needs: [linux_native, linux_arm, freebsd]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pretty_target: linux-x86_64-gnu
            verify_host: ubuntu-24.04-arm
          - pretty_target: linux-x86_64-musl
            verify_host: ubuntu-24.04-arm
          - pretty_target: linux-aarch64-gnu
            verify_host: freebsd-14.4-x86_64
          - pretty_target: linux-aarch64-musl
            verify_host: freebsd-14.4-x86_64
    steps:
      - name: Download Linux x86-64-host artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducible-${{ matrix.pretty_target }}-ubuntu-24.04
          path: artifacts/original

      - name: Download alternative-host artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducible-${{ matrix.pretty_target }}-${{ matrix.verify_host }}
          path: artifacts/verification

      - name: Compare binary and archive SHA-256 hashes
        run: |
          (cd artifacts/original && sha256sum binary archive) > original.sha256
          (cd artifacts/verification && sha256sum binary archive) > verification.sha256
          diff -u original.sha256 verification.sha256

  windows_hashes:
    name: SHA-256 (Windows x86-64 vs ARM64 hosts)
    needs: [windows_native, windows_arm]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows x86-64-host artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducible-windows-x86_64-windows-2025
          path: artifacts/original

      - name: Download Windows ARM64-host artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducible-windows-x86_64-windows-11-vs2026-arm
          path: artifacts/verification

      - name: Compare binary and archive SHA-256 hashes
        run: |
          (cd artifacts/original && sha256sum binary archive) > original.sha256
          (cd artifacts/verification && sha256sum binary archive) > verification.sha256
          diff -u original.sha256 verification.sha256

  macos_hashes:
    name: SHA-256 (macOS ARM64 vs Intel hosts)
    needs: [macos_native, macos_intel]
    runs-on: ubuntu-24.04
    steps:
      - name: Download macOS ARM64-host artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducible-macos-aarch64-macos-15
          path: artifacts/original

      - name: Download Intel macOS-host artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducible-macos-aarch64-macos-15-intel
          path: artifacts/verification

      - name: Compare binary and archive SHA-256 hashes
        run: |
          (cd artifacts/original && sha256sum binary archive) > original.sha256
          (cd artifacts/verification && sha256sum binary archive) > verification.sha256
          diff -u original.sha256 verification.sha256
