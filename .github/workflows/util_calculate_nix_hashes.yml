name: Calculate celq nixpkg hashes

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New version to calculate hashes for (e.g., 0.3.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  calculate-hashes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      
      - name: Make script executable
        run: chmod +x .github/scripts/nix-hashes.sh
      
      - name: Calculate hashes
        id: hashes
        run: .github/scripts/nix-hashes.sh "${{ inputs.new_version }}" # zizmor: ignore[template-injection] trusted manual release input
