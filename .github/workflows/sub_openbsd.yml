name: OpenBSD (Subworkflow)

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: OpenBSD (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cirrus.star'
              - '.github/workflows/main.yml'
              - '.github/workflows/sub_openbsd.yml'
              - '.github/actions/restore-cargo-downloads/**'
              - '.cargo/**'
              - 'src/**'
              - 'tests/**'
              - '.github/scripts/smoke-test.sh'

      - name: Restore Cargo downloads
        if: steps.filter.outputs.rust == 'true'
        uses: $/.github/actions/restore-cargo-downloads

      - name: Pack Cargo registry for the VM
        if: steps.filter.outputs.rust == 'true'
        run: tar -czf cargo-registry-cache.tar.gz -C "$HOME/.cargo" registry

      - name: Test on OpenBSD
        if: steps.filter.outputs.rust == 'true'
        uses: vmactions/openbsd-vm@v1.4.7
        with:
          release: "7.9"
          usesh: true
          prepare: |
            pkg_add rust
          run: |
            mkdir -p "$HOME/.cargo"
            tar -xzf cargo-registry-cache.tar.gz -C "$HOME/.cargo"
            cargo build --locked
            cargo test --locked
