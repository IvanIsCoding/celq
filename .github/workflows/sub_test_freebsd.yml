name: Test FreeBSD (Subworkflow)

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on FreeBSD (${{ matrix.release }} – ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - release: "14.4"
            arch: x86_64
            artifact: celq-x86_64-unknown-freebsd
          - release: "14.4"
            arch: aarch64
            artifact: celq-aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download celq binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1.5.5
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          run: |
            chmod +x ./bin/celq
            sh .github/scripts/smoke-test.sh ./bin/celq
