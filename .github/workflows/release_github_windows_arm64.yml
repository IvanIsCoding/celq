name: One-off Windows ARM64 GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example, 0.6.0)
        required: true
        default: "0.6.0"
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-upload:
    name: Windows ARM64
    runs-on: windows-11-vs2026-arm
    environment: github_release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Build Windows ARM64 binary
        run: cargo auditable build --locked --release --target aarch64-pc-windows-msvc

      - name: Create release archive
        id: archive
        run: |
          archive="celq-windows-arm64.zip"
          7z a "$archive" "target/aarch64-pc-windows-msvc/release/celq.exe"
          7z rn "$archive" "target/aarch64-pc-windows-msvc/release/celq.exe" "celq.exe"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Generate attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.archive.outputs.archive }}

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.version }}" "${{ steps.archive.outputs.archive }}" --repo "${{ github.repository }}"
