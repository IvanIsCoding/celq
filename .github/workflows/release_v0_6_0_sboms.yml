name: Publish v0.6.0 SBOMs

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  publish-sboms:
    name: SBOM (${{ matrix.target }})
    runs-on: ubuntu-latest
    environment: github_release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, archive: celq-macos-aarch64.tar.gz, binary: celq }
          - { target: macos-x86_64, archive: celq-macos-x86_64.tar.gz, binary: celq }
          - { target: windows-x86_64, archive: celq-windows-x86_64.zip, binary: celq.exe }
          - { target: windows-arm64, archive: celq-windows-arm64.zip, binary: celq.exe }
          - { target: linux-x86_64-musl, archive: celq-linux-x86_64-musl.tar.gz, binary: celq }
          - { target: linux-aarch64-musl, archive: celq-linux-aarch64-musl.tar.gz, binary: celq }
          - { target: linux-x86_64-gnu, archive: celq-linux-x86_64-gnu.tar.gz, binary: celq }
          - { target: linux-aarch64-gnu, archive: celq-linux-aarch64-gnu.tar.gz, binary: celq }
          - { target: linux-riscv64-gnu, archive: celq-linux-riscv64-gnu.tar.gz, binary: celq }
          - { target: linux-riscv64-musl, archive: celq-linux-riscv64-musl.tar.gz, binary: celq }
          - { target: freebsd-x86_64, archive: celq-freebsd-x86_64.tar.gz, binary: celq }
          - { target: freebsd-aarch64, archive: celq-freebsd-aarch64.tar.gz, binary: celq }
    steps:
      - name: Download release archive
        env:
          ARCHIVE: ${{ matrix.archive }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.6.0
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --pattern "${ARCHIVE}" \
            --dir release-assets

      - name: Extract release binary
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p binary
          case "${ARCHIVE}" in
            *.tar.gz) tar xzf "release-assets/${ARCHIVE}" -C binary ;;
            *.zip) unzip -q "release-assets/${ARCHIVE}" -d binary ;;
          esac

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate CycloneDX JSON SBOM
        env:
          BINARY: ${{ matrix.binary }}
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          "${SYFT_CMD}" scan "binary/${BINARY}" \
            --output cyclonedx-json=binary.cyclonedx.json

      - name: Attest binary SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: binary/${{ matrix.binary }}
          sbom-path: binary.cyclonedx.json
